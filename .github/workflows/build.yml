name: Deploy Lyra AI & Auto Update README

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-lyra:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Lyra Server & Tunnel
        run: |
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          sleep 5

          cloudflared tunnel --url http://127.0.0.1:8000 > cloudflare.log 2>&1 &
          echo "Waiting for Tunnel URL..."
          sleep 12

          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' cloudflare.log | head -n 1)
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "Error: Tunnel URL not found!"
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "Live URL: $TUNNEL_URL"

      - name: Update README.md with New URL
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          cat << EOF > README.md
          # 🌟 LYRA AI - Llama Engine
          **Created by:** Muhammad Taqi

          ---

          ### 🚀 Live URL (Auto-Updated):
          👉 **[Click Here to Open Lyra AI]($TUNNEL_URL)**
          
          * **Direct Link:** \`$TUNNEL_URL\`
          * **Engine:** \`Llama-3.3-70B\`
          * **Last Restarted:** \`$TIMESTAMP\`
          * **Status:** 🟢 Active (Auto-restarts every 5 hours)

          ---
          *Powered by FastAPI, TryCloudflare, and GitHub Actions.*
          EOF

          git add README.md
          git commit -m "Auto-update Lyra Tunnel URL [$TIMESTAMP]" || exit 0
          git push

      - name: Keep Server Alive
        run: |
          echo "Lyra Llama Tunnel is active..."
          sleep 17000
