name: Deploy Lyra AI & Auto Update README

on:
  workflow_dispatch: # Manual run button
  schedule:
    - cron: '0 */5 * * *' # Har 5 ghante baad auto restart hoga

jobs:
  run-lyra:
    runs-on: ubuntu-latest
    permissions:
      contents: write # README.md update aur commit karne ki permission

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Lyra Server & Capture Tunnel URL
        run: |
          # FastAPI Server ko background mein start karein
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          sleep 5

          # TryCloudflare Tunnel run karke URL ko output log file mein save karein
          cloudflared tunnel --url http://127.0.0.1:8000 > cloudflare.log 2>&1 &
          
          # URL generate hone tak wait karein
          echo "Waiting for Cloudflare Tunnel URL..."
          sleep 12

          # Cloudflare Log file se trycloudflare.com URL extract karein
          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' cloudflare.log | head -n 1)
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "Error: Cloudflare URL generate nahi ho saka!"
            exit 1
          fi

          echo "Generated URL: $TUNNEL_URL"
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV

      - name: Update README.md with New URL
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # README.md update karne ka logic
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          cat << EOF > README.md
          # 🌟 LYRA AI - Unlimited Engine
          **Created by:** Muhammad Taqi

          ---

          ### 🚀 Live URL (Auto-Updated):
          👉 **[Click Here to Open Lyra AI]($TUNNEL_URL)**
          
          * **Direct Link:** \`$TUNNEL_URL\`
          * **Last Restarted:** \`$TIMESTAMP\`
          * **Status:** 🟢 Active (Auto-restarts every 5 hours)

          ---
          *Powered by FastAPI, TryCloudflare, and GitHub Actions.*
          EOF

          # GitHub par auto-commit aur push karein
          git add README.md
          git commit -m "Auto-update Lyra Tunnel URL [$TIMESTAMP]" || exit 0
          git push
